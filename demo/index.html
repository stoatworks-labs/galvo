  <body>
    <main id="demo">
      <noscript>
        <h1>Galvo</h1>
        <p>
          An FFGL effect that finds the outlines in a clip and scans them the
          way a laser projector does, with two galvanometer mirrors chasing a
          point stream at a fixed rate. The bright dots at the corners, the
          corners rounding off at speed, the ringing and the crawl on a frame
          too busy to finish are all where the beam went, not things drawn on
          afterwards.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/galvo">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/galvo/">Project page and downloads</a></li>
          <li><a href="https://github.com/stoatworks-labs/galvo">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>

    <script type="module" src="./plugin.js"></script>
